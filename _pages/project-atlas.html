<script>
document.addEventListener("DOMContentLoaded", async () => {
  const countEl = document.getElementById("countLabel");
  try {
    // Make sure libs exist
    if (typeof L === "undefined") throw new Error("Leaflet (L) not loaded");
    if (typeof noUiSlider === "undefined") throw new Error("noUiSlider not loaded");

    const dataUrl = "{{ '/assets/data/portfolio.json' | absolute_url }}";
    const res = await fetch(dataUrl, { cache: "no-store" });
    if (!res.ok) throw new Error(`portfolio.json fetch failed: ${res.status}`);

    const items = await res.json();
    if (!Array.isArray(items) || items.length === 0) throw new Error("portfolio.json is empty or not an array");

    const parsed = items.map(p => {
      const sy = new Date(p.start).getFullYear();
      const ey = new Date(p.end).getFullYear();
      return { ...p, startYear: sy, endYear: ey };
    });

    const years = parsed.flatMap(p => [p.startYear, p.endYear]).filter(Number.isFinite);
    const minYear = Math.min(...years);
    const maxYear = Math.max(...years);

    // Init map
    const map = L.map("map", { scrollWheelZoom: false }).setView([0, 20], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    function overlaps(p, lo, hi) {
      return (p.startYear <= hi) && (p.endYear >= lo);
    }

    function render(lo, hi) {
      document.getElementById("rangeLabel").textContent = `${lo} — ${hi}`;

      const filtered = parsed.filter(p => overlaps(p, lo, hi));

      const cards = document.getElementById("cards");
      cards.innerHTML = filtered.map(p => `
        <a class="atlas-card" href="${p.url}">
          <div class="atlas-thumb"><img src="${p.thumb}" alt="${p.title}"></div>
          <div class="atlas-meta">
            <div class="atlas-card-title">${p.title}</div>
            <div class="atlas-card-sub">${p.location || ""}</div>
            <div class="atlas-card-date">${p.startYear}–${p.endYear}</div>
          </div>
        </a>
      `).join("");

      countEl.textContent = `${filtered.length} project${filtered.length === 1 ? "" : "s"} shown`;

      markersLayer.clearLayers();
      const bounds = [];

      filtered.forEach(p => {
        const lat = Number(p.lat), lon = Number(p.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

        const m = L.marker([lat, lon]).addTo(markersLayer);
        m.bindPopup(`
          <div style="max-width:220px">
            <div style="font-weight:700; margin-bottom:6px">${p.title}</div>
            <div style="opacity:.75; margin-bottom:8px">${p.location || ""}</div>
            <a href="${p.url}" style="color:#0b4f7a; text-decoration:none; font-weight:600">
              Open project →
            </a>
          </div>
        `);

        bounds.push([lat, lon]);
      });

      if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
    }

    // Slider
    const slider = document.getElementById("yearSlider");
    noUiSlider.create(slider, {
      start: [minYear, maxYear],
      connect: true,
      step: 1,
      range: { min: minYear, max: maxYear },
      format: { to: v => Math.round(v), from: v => Number(v) }
    });

    slider.noUiSlider.on("update", (values) => {
      render(Number(values[0]), Number(values[1]));
    });

    render(minYear, maxYear);

  } catch (err) {
    console.error(err);
    if (countEl) {
      countEl.textContent = "Atlas failed to load. Check console for details.";
      countEl.style.color = "#b00020";
      countEl.style.opacity = "1";
    }
  }
});
</script>
