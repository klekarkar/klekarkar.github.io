<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.css">
<script src="https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.js"></script>

<div class="atlas">
  <div class="atlas-bar">
    <div class="atlas-title">Filter by project period</div>
    <div class="atlas-range">
      <span id="rangeLabel" class="atlas-range-label"></span>
      <div id="yearSlider" class="atlas-slider"></div>
    </div>
  </div>

  <div class="atlas-main">
    <div id="map" class="atlas-map"></div>

    <div class="atlas-side">
      <div class="atlas-count" id="countLabel"></div>
      <div id="cards" class="atlas-cards"></div>
    </div>
  </div>
</div>

<script>
(async function () {
  const res = await fetch("{{ '/assets/data/portfolio.json' | relative_url }}");
  const items = await res.json();

  // Parse years
  const parsed = items.map(p => {
    const sy = new Date(p.start).getFullYear();
    const ey = new Date(p.end).getFullYear();
    return { ...p, startYear: sy, endYear: ey };
  });

  // Determine slider bounds
  const years = parsed.flatMap(p => [p.startYear, p.endYear]).filter(Number.isFinite);
  const minYear = Math.min(...years);
  const maxYear = Math.max(...years);

  // Init map
  const map = L.map("map", { scrollWheelZoom: false }).setView([0, 20], 2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  const markersLayer = L.layerGroup().addTo(map);

  function overlaps(p, lo, hi) {
    return (p.startYear <= hi) && (p.endYear >= lo);
  }

  function render(lo, hi) {
    // Update labels
    document.getElementById("rangeLabel").textContent = `${lo} — ${hi}`;

    // Filter
    const filtered = parsed.filter(p => overlaps(p, lo, hi));

    // Cards
    const cards = document.getElementById("cards");
    cards.innerHTML = filtered.map(p => `
      <a class="atlas-card" href="${p.url}">
        <div class="atlas-thumb"><img src="${p.thumb}" alt="${p.title}"></div>
        <div class="atlas-meta">
          <div class="atlas-card-title">${p.title}</div>
          <div class="atlas-card-sub">${p.location || ""}</div>
          <div class="atlas-card-date">${p.startYear}–${p.endYear}</div>
        </div>
      </a>
    `).join("");

    document.getElementById("countLabel").textContent =
      `${filtered.length} project${filtered.length === 1 ? "" : "s"} shown`;

    // Markers
    markersLayer.clearLayers();

    const bounds = [];
    filtered.forEach(p => {
      if (p.lat === "" || p.lon === "") return;
      const lat = Number(p.lat), lon = Number(p.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

      const m = L.marker([lat, lon]).addTo(markersLayer);
      m.bindPopup(`
        <div style="max-width:220px">
          <div style="font-weight:700; margin-bottom:6px">${p.title}</div>
          <div style="opacity:.75; margin-bottom:8px">${p.location || ""}</div>
          <a href="${p.url}" style="color:#0b4f7a; text-decoration:none; font-weight:600">Open project →</a>
        </div>
      `);
      bounds.push([lat, lon]);
    });

    if (bounds.length) {
      map.fitBounds(bounds, { padding: [30, 30] });
    }
  }

  // Slider
  const slider = document.getElementById("yearSlider");
  noUiSlider.create(slider, {
    start: [minYear, maxYear],
    connect: true,
    step: 1,
    range: { min: minYear, max: maxYear },
    format: {
      to: v => Math.round(v),
      from: v => Number(v)
    }
  });

  slider.noUiSlider.on("update", (values) => {
    const lo = Number(values[0]);
    const hi = Number(values[1]);
    render(lo, hi);
  });

  // Initial render
  render(minYear, maxYear);
})();
</script>
