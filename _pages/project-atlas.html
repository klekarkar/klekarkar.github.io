<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Marker clustering (recommended) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<div class="atlas">
  <aside class="atlas-side">
    <h2 style="margin-top:0;">Browse</h2>
    <p style="opacity:.85; margin-top:.25rem;">
      Search projects and click a result to zoom to its location.
    </p>

    <input id="atlasSearch" class="atlas-search" type="search" placeholder="Search title, location, tags…" autocomplete="off">

    <div class="atlas-meta">
      <span id="atlasCount" style="opacity:.8;">Loading…</span>
      <button id="atlasClear" class="atlas-clear" type="button">Clear</button>
    </div>

    <div id="atlasList" class="atlas-list"></div>
  </aside>

  <section class="atlas-main">
    <div class="atlas-mapWrap">
      <div id="atlasMap" class="atlas-map"></div>
    </div>
  </section>
</div>

<style>
  .atlas{
    display:grid;
    grid-template-columns: 600px 1fr;
    gap: 16px;
    margin-top: 1rem;
    align-items: stretch;
  }

  @media (max-width: 980px){
    .atlas{ grid-template-columns: 1fr; }
  }
  .atlas-side{
    border:1px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px;
    background: #fff;
    min-height: 520px;
  }
  .atlas-search{
    width:100%;
    padding: 10px 12px;
    border:1px solid #e5e7eb;
    border-radius: 12px;
    font-size: 0.95rem;
    outline: none;
  }
  .atlas-search:focus{
    border-color:#cbd5e1;
    box-shadow: 0 0 0 3px rgba(148,163,184,.25);
  }
  .atlas-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top: 10px;
    gap: 10px;
  }
  .atlas-clear{
    border:1px solid #e5e7eb;
    background:#fff;
    border-radius: 999px;
    padding: 6px 10px;
    cursor:pointer;
    font-size: .9rem;
  }
  .atlas-clear:hover{ background:#f8fafc; }

  .atlas-list{
    margin-top: 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height: 430px;
    overflow:auto;
    padding-right: 4px;
  }
  .atlas-item{
    display:flex;
    gap:10px;
    text-decoration:none;
    color: inherit;
    border:1px solid #e5e7eb;
    border-radius: 14px;
    overflow:hidden;
    background:#fff;
    cursor:pointer;
  }
  .atlas-item:hover{ background:#f8fafc; }
  .atlas-thumb{
    width: 86px;
    height: 74px;
    flex: 0 0 auto;
    background:#f1f5f9;
  }
  .atlas-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .atlas-text{
    padding:10px 10px 10px 0;
    min-width: 0;
  }
  .atlas-title{
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 4px;
    font-size: .95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .atlas-sub{
    opacity:.8;
    font-size: .9rem;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  .atlas-tags{
    margin-top: 6px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .atlas-tag{
    font-size: .75rem;
    padding: 2px 8px;
    border-radius: 999px;
    border:1px solid #e5e7eb;
    background:#fff;
    opacity:.9;
  }

  .atlas-mapWrap{
    border:1px solid #e5e7eb;
    border-radius: 14px;
    overflow:hidden;
    background:#fff;
  }

  /* Fill most of the viewport */
  .atlas-side{
    min-height: calc(100vh - 220px); /* adjust 220px if your header is taller */
  }

  .atlas-map{
    height: calc(100vh - 220px);
    width: 100%;
  }

  /* Popup typography */
  .leaflet-popup-content{ margin: 12px 14px; }
  .popup-title{ font-weight:700; margin-bottom:4px; }
  .popup-sub{ opacity:.75; margin-bottom:8px; }
  .popup-link{ text-decoration:none; font-weight:600; }
</style>

<script>
  window.__ATLAS_DATA_URL__ = "{{ '/assets/data/portfolio.json' | relative_url }}";
</script>
<script defer src="{{ '/assets/js/project-atlas.js' | relative_url }}"></script>
