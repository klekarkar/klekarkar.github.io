<div id="career-timeline"
     style="height: 360px; border: 1px solid #e5e7eb; border-radius: 12px;"></div>
<p style="margin-top:10px; opacity:0.8; font-size:0.95em;">
  Tip: drag to pan, scroll to zoom, click an item for details.
</p>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.2/styles/vis-timeline-graph2d.min.css">
<script defer
        src="https://cdn.jsdelivr.net/npm/vis-timeline@7.7.2/standalone/umd/vis-timeline-graph2d.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Make sure the library loaded
    if (!window.vis || !document.getElementById("career-timeline")) {
      console.warn("vis-timeline failed to load or container missing.");
      return;
    }

    const items = new vis.DataSet([
      { id: 1, group: 1, content: "BSc Civil Engineering", start: "2014-09-01", end: "2018-06-30", url: "/cv/" },
      { id: 2, group: 1, content: "MSc Water Resources (IUPWARE)", start: "2019-09-01", end: "2021-06-30", url: "/cv/" },
      { id: 3, group: 2, content: "Water resources engineering (Kenya)", start: "2021-07-01", end: "2024-08-31", url: "/portfolio/" },
      { id: 4, group: 3, content: "PhD – Water & Climate Research Group (VUB)", start: "2024-09-01", url: "/research/" }
    ]);

    const groups = new vis.DataSet([
      { id: 1, content: "Education" },
      { id: 2, content: "Industry" },
      { id: 3, content: "Research" }
    ]);

    const options = {
      stack: true,
      groupOrder: "content",
      margin: { item: 12, axis: 8 },
      tooltip: { followMouse: true }
    };

    const container = document.getElementById("career-timeline");
    const timeline = new vis.Timeline(container, items, groups, options);

    timeline.on("select", function (props) {
      if (!props.items.length) return;
      const item = items.get(props.items[0]);
      if (item && item.url) window.location.href = item.url;
    });
  });
</script>
<style>
  #career-timeline .vis-item {
    cursor: pointer;
  }
